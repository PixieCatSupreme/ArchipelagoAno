name: Release an apworld
description: Package an apworld, generate a default template and create a new release

on:
  workflow_call:
    inputs:
      ap-version:
        description: The version of archipelago to use. This must match a refspec in the archipelago repository
        required: true
        type: string
      python-version:
        description: The python version to use
        required: true
        type: string
      apworld-path:
        description: The path to the apworld folder or apworld file itself
        required: true
        type: string
      apworld-name:
        description: The name of the apworld. This should only be set if the folder storing your apworld in the repository isn't the same
        type: string
      prerelease:
        description: Optionally marks the release as a pre-release
        required: false
        type: boolean
        default: false

jobs:
  package-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Package apworld tracker
        id: package
        uses: PixieCatSupreme/ArchipelagoAno/.github/package-tracker@anodyne
        with:
          path: ${{ inputs.apworld-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: tracker
          path: ${{ steps.package.outputs.tracker }}
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repo
        uses: actions/checkout@master
      - name: Remove tracker folder
        shell: bash
        run: rm -r ${{inputs.apworld-path}}/tracker
      - name: Get Name
        id: get_name
        uses: mikefarah/yq@v4.45.1
        with:
          cmd: yq .game ${{ inputs.apworld-path }}/archipelago.json --unwrapScalar=true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-subtests pytest-xdist
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          python Launcher.py --update_settings  # make sure host.yaml exists for tests
          python Launcher.py "Build APWorlds" "${{ steps.get_name.outputs.result }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apworld
          path: build/apworlds/${{ inputs.apworld-name }}.apworld

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/generate-template@main
        id: template
        with:
          apworld-path: ${{ inputs.apworld-path }}
          ap-version: ${{ inputs.ap-version }}
          python-version: ${{ inputs.python-version }}

      - uses: actions/upload-artifact@v4
        with:
          name: template
          path: ${{ steps.template.outputs.template }}

  publish:
    runs-on: ubuntu-latest
    needs: [package-tracker, package, template]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apworld

      - uses: actions/download-artifact@v4
        with:
          name: template
      
      - uses: actions/download-artifact@v4
        with:
          name: tracker

      - uses: ncipollo/release-action@v1
        with:
          artifacts: '*'
          allowUpdates: true
          prerelease: ${{ inputs.prerelease }}
          immutableCreate: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true