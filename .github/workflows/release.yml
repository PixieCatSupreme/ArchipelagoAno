name: Release APWorld
on:
  push:
    tags:
      - '**'
jobs:
  release:
    uses: ./.github/workflows/release-workflow.yml
    with:
      apworld-path: worlds/anodyne
      ap-version: '0.6.3'
      python-version: '3.12'
      prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc')}}
